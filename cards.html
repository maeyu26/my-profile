<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三人の自己紹介ページ</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 py-8">
    <main class="max-w-4xl mx-auto px-4">
      <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">ゆかいな仲間たち</h1>

      <div class="flex flex-col md:flex-row gap-6">

        <div class="flex-1 bg-white rounded-lg shadow p-6 flex flex-col items-center">
          <span class="text-5xl">🌬</span>
          <h2 class="text-xl font-bold text-gray-900 mt-3">風</h2>
          <p class="text-gray-600 mt-2 text-center">疾如風</p>
        </div>

        <div class="flex-1 bg-white rounded-lg shadow p-6 flex flex-col items-center">
          <span class="text-5xl">🌳</span>
          <h2 class="text-xl font-bold text-gray-900 mt-3">林</h2>
          <p class="text-gray-600 mt-2 text-center">徐如林</p>
        </div>

        <div class="flex-1 bg-white rounded-lg shadow p-6 flex flex-col items-center">
          <span class="text-5xl">🔥</span>
          <h2 class="text-xl font-bold text-gray-900 mt-3">火</h2>
          <p class="text-gray-600 mt-2 text-center">侵掠如火</p>
        </div>

      </div>
    </main>
  </body>
</html>
