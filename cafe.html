<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喫茶 BOUTOR メニュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-amber-50 font-serif text-stone-800">
    <header class="bg-amber-900 text-center px-4 py-10">
      <h1 class="text-4xl font-bold text-amber-50 tracking-widest">喫茶 BOUTOR</h1>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-10">
      <!-- コーヒー -->
      <section class="mb-12">
        <h2 class="text-3xl font-bold text-amber-900 border-b-2 border-amber-900 pb-2 mb-6">珈琲</h2>

        <div class="bg-white rounded-lg shadow p-6 mb-4 border border-amber-200 hover:shadow-lg hover:border-amber-400">
          <h3 class="text-2xl font-bold text-amber-900">こーひー</h3>
          <p class="text-lg text-stone-700 leading-relaxed mt-2">おいしいよ</p>
          <p class="text-2xl font-bold text-red-800 mt-3">500円</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-4 border border-amber-200 hover:shadow-lg hover:border-amber-400">
          <h3 class="text-2xl font-bold text-amber-900">カフェオレ</h3>
          <p class="text-lg text-stone-700 leading-relaxed mt-2">とってもおいしいよ</p>
          <p class="text-2xl font-bold text-red-800 mt-3">500円</p>
        </div>
      </section>

      <!-- サンドイッチ -->
      <section class="mb-12">
        <h2 class="text-3xl font-bold text-amber-900 border-b-2 border-amber-900 pb-2 mb-6">サンドイッチ</h2>

        <div class="bg-white rounded-lg shadow p-6 mb-4 border border-amber-200 hover:shadow-lg hover:border-amber-400">
          <h3 class="text-2xl font-bold text-amber-900">たまごサンド</h3>
          <p class="text-lg text-stone-700 leading-relaxed mt-2">もっととってもおいしいよ</p>
          <p class="text-2xl font-bold text-red-800 mt-3">500円</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-4 border border-amber-200 hover:shadow-lg hover:border-amber-400">
          <h3 class="text-2xl font-bold text-amber-900">カツサンド</h3>
          <p class="text-lg text-stone-700 leading-relaxed mt-2">かなりおいしいよ</p>
          <p class="text-2xl font-bold text-red-800 mt-3">500円</p>
        </div>
      </section>

      <!-- オムライス -->
      <section class="mb-12">
        <h2 class="text-3xl font-bold text-amber-900 border-b-2 border-amber-900 pb-2 mb-6">オムライス</h2>

        <div class="bg-white rounded-lg shadow p-6 mb-4 border border-amber-200 hover:shadow-lg hover:border-amber-400">
          <h3 class="text-2xl font-bold text-amber-900">昔ながらのオムライス</h3>
          <p class="text-lg text-stone-700 leading-relaxed mt-2">もうコメントが思いつかないよ</p>
          <p class="text-2xl font-bold text-red-800 mt-3">500円</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-4 border border-amber-200 hover:shadow-lg hover:border-amber-400">
          <h3 class="text-2xl font-bold text-amber-900">デミグラスオムライス</h3>
          <p class="text-lg text-stone-700 leading-relaxed mt-2">メニュー増やし過ぎたよ</p>
          <p class="text-2xl font-bold text-red-800 mt-3">500円</p>
        </div>
      </section>

      <p class="text-lg text-stone-700 text-center">※ 価格はすべて税抜表示です</p>
    </main>

  </body>
</html>
