<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>まえゆうのプロフィール</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-800">
    <header class="bg-white shadow">
      <div class="max-w-2xl mx-auto p-6 text-center">
        <img src="./images/icon.jpg" alt="まえゆうのアイコン画像" class="w-32 h-32 mx-auto rounded-full object-cover">
        <h1 class="text-3xl font-bold text-gray-900 mt-4">まえゆう</h1>
        <p class="text-gray-600 mt-2">べべべ</p>
      </div>
    </header>

    <main class="max-w-2xl mx-auto p-6 space-y-6">
      <section class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold text-gray-900 mb-4">自己紹介</h2>
        <p class="text-gray-600 leading-relaxed">
          よろしくお願いいたします！プログラム始めたばっかで色々間違えると思いますがこれからよろしくお願いします！
        </p>
      </section>

      <section class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold text-gray-900 mb-4">好きなこと</h2>
        <ul class="list-disc list-inside text-gray-600 space-y-2">
          <li>旅行</li>
          <li>散歩</li>
          <li>マイクラ</li>
        </ul>
      </section>

      <section class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold text-gray-900 mb-4">リンク</h2>
        <ul class="space-y-2">
          <li>
            <a href=https://abehiroshi.la.coocan.jp/ target="_blank" class="text-green-600 underline">阿部寛のHP</a>
          </li>
        </ul>
      </section>
    </main>

    <footer class="text-center text-gray-400 text-sm p-6">
      <p>© 2026 まえゆう</p>
    </footer>
  </body>
</html>
